<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Inventory Furniture</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="inventory-app">
            <main class="main-content">
                <header class="topbar">
                    <h2 class="section-title">Furniture</h2>
                    <div class="search-box">
                        <span class="search-icon">⌕</span>
                        <input type="search" id="searchInput" class="search-input" placeholder="Search">
                    </div>
                    <div class="topbar-actions">
                        <div class="filter-wrapper">
                            <button type="button" id="filterBtn" class="action-button">
                                <span>🝖 Filter Data</span>
                            </button>
                            <div id="filterMenu" class="filter-dropdown">
                            </div>
                        </div>
                        <a href="adddata.html" class="action-button primary-action">
                            <span>+ Add data</span>
                        </a>
                    </div>
                </header>
                <section class="table-section">
                    <div class="table-wrapper">
                        <table class="inventory-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Brand</th>
                                    <th>Category</th>
                                    <th>Material</th>
                                    <th>Color</th>
                                    <th>Inventory</th>
                                    <th>Cost</th>
                                    <th>Price</th>
                                    <th>Sales</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="10" class="empty-state">Data inventory akan ditampilkan di sini setelah dataset CSV diintegrasikan.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
                <div class="pagination" id="pagination">
                    <button class="page-button" id="prevPage" type="button" aria-label="Previous page">‹</button>
                    <div id="pageNumbers" class="page-numbers-container"></div>
                    <button class="page-button" id="nextPage" type="button" aria-label="Next page">›</button>
                </div>
            </main>
        </div>
    </div>
    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Furniture Data</h3>
                <button type="button" id="closeEditModal" class="modal-close">×</button>
            </div>
            <form id="editDataForm" class="inventory-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editId">ID</label>
                        <input type="text" id="editId" required>
                    </div>
                    <div class="form-group">
                        <label for="editBrand">Brand</label>
                        <input type="text" id="editBrand" required>
                    </div>
                    <div class="form-group">
                        <label for="editCategory">Category</label>
                        <input type="text" id="editCategory" required>
                    </div>
                    <div class="form-group">
                        <label for="editMaterial">Material</label>
                        <input type="text" id="editMaterial" required>
                    </div>
                    <div class="form-group">
                        <label for="editColor">Color</label>
                        <input type="text" id="editColor" required>
                    </div>
                    <div class="form-group">
                        <label for="editInventory">Inventory</label>
                        <input type="number" id="editInventory" required>
                    </div>
                    <div class="form-group">
                        <label for="editCost">Cost</label>
                        <input type="number" step="any" id="editCost" required>
                    </div>
                    <div class="form-group">
                        <label for="editPrice">Price</label>
                        <input type="number" step="any" id="editPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="editSales">Sales</label>
                        <input type="number" id="editSales" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelEditBtn" class="action-button">Cancel</button>
                    <button type="submit" class="action-button primary-action">Update Data</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
